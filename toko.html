<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segari Mitra - Dashboard Toko</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .btn-active:active { transform: scale(0.96); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 font-sans antialiased flex justify-center text-gray-800">

    <div class="w-full max-w-[480px] min-h-screen bg-white shadow-2xl relative flex flex-col pb-12 border-x border-gray-100">
        
        <header class="bg-emerald-600 text-white p-4 rounded-b-3xl shadow-md space-y-4 sticky top-0 z-30">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <div class="w-10 h-10 bg-white/20 border border-white/10 rounded-full flex items-center justify-center font-black text-base uppercase" id="toko-avatar">
                        T
                    </div>
                    <div>
                        <h1 class="text-xs text-emerald-100 font-bold uppercase tracking-wider">Mitra Toko Segari</h1>
                        <p class="text-sm font-black tracking-tight" id="toko-username">Nama Toko</p>
                    </div>
                </div>
                
                <button onclick="handleTokoLogout()" class="p-2 bg-white/10 hover:bg-rose-500/20 border border-white/10 hover:border-rose-500/30 text-white rounded-xl transition btn-active" title="Keluar Akun">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-2">
                <div class="bg-white/10 border border-white/5 rounded-xl p-3 text-left">
                    <span class="text-[10px] text-emerald-100 font-bold block">Pesanan Masuk</span>
                    <span class="text-base font-black" id="total-orders-count">0</span>
                </div>
                <div class="bg-white/10 border border-white/5 rounded-xl p-3 text-left">
                    <span class="text-[10px] text-emerald-100 font-bold block">Total Produk Aktif</span>
                    <span class="text-base font-black" id="total-products-count">0</span>
                </div>
            </div>
        </header>

        <main class="p-4 space-y-6 flex-grow">
            
            <div class="space-y-3">
                <div class="flex justify-between items-center">
                    <h2 class="text-sm font-black text-gray-800 flex items-center gap-1.5">
                        <i data-lucide="package" class="w-4 h-4 text-emerald-600"></i> Antrean Pesanan Masuk
                    </h2>
                    <span class="text-[10px] bg-amber-50 text-amber-700 border border-amber-100 px-2 py-0.5 rounded-full font-bold">Butuh Diproses</span>
                </div>
                
                <div id="toko-order-list" class="space-y-3">
                    </div>
            </div>

            <div class="space-y-3">
                <h2 class="text-sm font-black text-gray-800 flex items-center gap-1.5">
                    <i data-lucide="layers" class="w-4 h-4 text-emerald-600"></i> Pantau Stok Produk Gudang
                </h2>
                <div class="bg-white border border-gray-100 rounded-2xl shadow-sm divide-y divide-gray-50 overflow-hidden text-xs" id="toko-stock-list">
                    </div>
            </div>

            <div class="pt-4">
                <button onclick="handleTokoLogout()" class="w-full bg-rose-50 border border-rose-100 hover:bg-rose-100 text-rose-600 font-bold py-3 rounded-2xl text-xs transition btn-active flex items-center justify-center gap-2 shadow-sm">
                    <i data-lucide="power" class="w-4 h-4"></i> Keluar Dari Panel Dashboard
                </button>
            </div>

        </main>

        <footer class="text-center py-4 text-[10px] text-gray-400 font-bold border-t border-gray-50 mt-auto">
            &copy; 2026 Segari Ecosystem. Hak Cipta Dilindungi.
        </footer>
    </div>

    <script>
        let session = null;
        let allOrders = [];
        let allProducts = [];

        window.addEventListener('DOMContentLoaded', () => {
            checkTokoAuth();
            loadDashboardData();
            lucide.createIcons();
            
            // Pasang event listener untuk memantau perubahan data lintas tab
            window.addEventListener('storage', () => {
                loadDashboardData();
            });
        });

        // 1. Auth Guard - Mengamankan Halaman Toko dari Akses Liar
        function checkTokoAuth() {
            session = JSON.parse(localStorage.getItem('segari_session')) || null;
            
            // Jika tidak ada sesi aktif atau peran akun bukan 'Toko', kunci halaman
            if (!session || session.role !== 'Toko') {
                alert("Akses ditolak! Anda harus masuk sebagai Akun Mitra Toko.");
                window.location.href = 'index.html';
            } else {
                // Konfigurasi profil data toko
                document.getElementById('toko-username').innerText = session.username;
                document.getElementById('toko-avatar').innerText = session.username.charAt(0);
            }
        }

        // 2. Load & Hitung Data dari LocalStorage
        function loadDashboardData() {
            allOrders = JSON.parse(localStorage.getItem('segari_orders')) || [];
            allProducts = JSON.parse(localStorage.getItem('segari_products')) || [];

            // Update indikator konter di header panel atas
            document.getElementById('total-orders-count').innerText = allOrders.length;
            document.getElementById('total-products-count').innerText = allProducts.length;

            renderOrders();
            renderStock();
        }

        // 3. Render Antrean Pesanan Konsumen
        function renderOrders() {
            const orderContainer = document.getElementById('toko-order-list');
            if (!orderContainer) return;
            orderContainer.innerHTML = '';

            if (allOrders.length === 0) {
                orderContainer.innerHTML = `
                    <div class="text-center py-8 bg-gray-50 border border-dashed border-gray-200 rounded-2xl text-xs text-gray-400 space-y-1">
                        <i data-lucide="package-open" class="w-8 h-8 mx-auto text-gray-300"></i>
                        <p>Belum ada order masuk dari pembeli.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            // Urutkan pesanan dari yang paling baru masuk (descending order)
            [...allOrders].reverse().forEach((order, index) => {
                const actualIndex = allOrders.length - 1 - index;
                const orderDiv = document.createElement('div');
                orderDiv.className = "bg-white border border-gray-100 rounded-2xl p-4 shadow-sm space-y-3";
                
                let itemNames = order.items.map(i => `${i.name} (${i.qty}x)`).join(', ');

                orderDiv.innerHTML = `
                    <div class="flex justify-between items-start border-b border-gray-50 pb-2">
                        <div>
                            <span class="text-[10px] font-mono font-bold text-gray-400 block">${order.invoice}</span>
                            <span class="text-[11px] font-bold text-gray-600">Konsumen: ${order.username}</span>
                        </div>
                        <span class="text-[10px] font-black px-2 py-0.5 rounded-full ${order.status === 'Menyiapkan Pesanan' ? 'bg-amber-50 text-amber-700 border border-amber-100' : 'bg-green-50 text-green-700 border border-green-100'}">
                            ${order.status}
                        </span>
                    </div>
                    <div class="text-xs text-gray-500 line-clamp-2">
                        <strong>Detail Belanja:</strong> ${itemNames}
                    </div>
                    <div class="flex justify-between items-center pt-1">
                        <div class="text-xs font-black text-emerald-600">
                            Pendapatan: Rp${order.total.toLocaleString('id-ID')}
                        </div>
                        ${order.status === 'Menyiapkan Pesanan' ? `
                            <button onclick="updateOrderStatus(${actualIndex}, 'Siap Dikirim')" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-[10px] px-3 py-1.5 rounded-xl btn-active transition">
                                Selesaikan Packing
                            </button>
                        ` : `
                            <span class="text-[10px] text-gray-400 flex items-center gap-1"><i data-lucide="check-circle" class="w-3 h-3 text-green-500"></i> Diserahkan ke Kurir</span>
                        `}
                    </div>
                `;
                orderContainer.appendChild(orderDiv);
            });
            lucide.createIcons();
        }

        // 4. Render Pemantauan Stok Produk Gudang
        function renderStock() {
            const stockContainer = document.getElementById('toko-stock-list');
            if (!stockContainer) return;
            stockContainer.innerHTML = '';

            if (allProducts.length === 0) {
                stockContainer.innerHTML = `<div class="p-4 text-center text-gray-400 text-xs">Produk etalase kosong.</div>`;
                return;
            }

            allProducts.forEach((p, index) => {
                const isLow = p.stock <= 5;
                const row = document.createElement('div');
                row.className = "p-3 flex justify-between items-center hover:bg-gray-50/50 transition";
                row.innerHTML = `
                    <div class="flex items-center gap-3">
                        <img src="${p.img}" class="w-8 h-8 object-cover rounded-lg border border-gray-100">
                        <div>
                            <h4 class="font-bold text-gray-800 max-w-[200px] truncate">${p.name}</h4>
                            <p class="text-[10px] text-gray-400">Harga Jual: Rp${p.price.toLocaleString('id-ID')} / ${p.size}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-mono font-black ${isLow ? 'text-red-500 bg-red-50 px-2 py-0.5 rounded-md animate-pulse' : 'text-gray-600'}">
                            Stok: ${p.stock}
                        </span>
                        <button onclick="restockItem(${index})" class="p-1.5 bg-gray-100 hover:bg-emerald-50 text-gray-500 hover:text-emerald-600 rounded-lg transition btn-active" title="Tambah Stok +10">
                            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                `;
                stockContainer.appendChild(row);
            });
            lucide.createIcons();
        }

        // 5. Fungsi Update Alur Status Order Pembeli
        function updateOrderStatus(index, newStatus) {
            allOrders[index].status = newStatus;
            localStorage.setItem('segari_orders', JSON.stringify(allOrders));
            loadDashboardData();
        }

        // 6. Fungsi Tambah Stok Cepat (+10 Item)
        function restockItem(index) {
            allProducts[index].stock += 10;
            localStorage.setItem('segari_products', JSON.stringify(allProducts));
            loadDashboardData();
        }

        // 7. FUNGSI LOGOUT UTAMA - MEMBERSIHKAN INTEGRASI DATA SESI MITRA
        function handleTokoLogout() {
            if (confirm("Apakah Anda yakin ingin keluar dari Panel Dashboard Mitra Toko?")) {
                // Hapus token sesi aktif toko dari localStorage
                localStorage.removeItem('segari_session');
                
                // Lempar balik ke pintu gerbang utama (index.html)
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
