<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segari Mitra - Dashboard Toko</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .btn-active:active { transform: scale(0.96); }
    </style>
</head>
<body class="bg-gray-50 font-sans antialiased flex justify-center text-gray-800">

    <div class="w-full max-w-[480px] min-h-screen bg-white shadow-2xl relative flex flex-col pb-12 border-x border-gray-100">
        
        <header class="bg-emerald-600 text-white p-4 rounded-b-3xl shadow-md space-y-4 sticky top-0 z-30">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <div class="w-10 h-10 bg-white/20 border border-white/10 rounded-full flex items-center justify-center font-black text-base uppercase" id="toko-avatar">
                        T
                    </div>
                    <div>
                        <h1 class="text-xs text-emerald-100 font-bold uppercase tracking-wider">Mitra Toko Segari</h1>
                        <p class="text-sm font-black tracking-tight" id="toko-username">Nama Toko</p>
                    </div>
                </div>
                
                <button onclick="handleTokoLogout()" class="p-2 bg-white/10 hover:bg-rose-500/20 border border-white/10 hover:border-rose-500/30 text-white rounded-xl transition btn-active" title="Keluar Akun">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-2">
                <div class="bg-white/10 border border-white/5 rounded-xl p-3 text-left">
                    <span class="text-[10px] text-emerald-100 font-bold block">Pesanan Masuk</span>
                    <span class="text-base font-black" id="total-orders-count">0</span>
                </div>
                <div class="bg-white/10 border border-white/5 rounded-xl p-3 text-left">
                    <span class="text-[10px] text-emerald-100 font-bold block">Total Produk Anda</span>
                    <span class="text-base font-black" id="total-products-count">0</span>
                </div>
            </div>
        </header>

        <main class="p-4 space-y-6 flex-grow">
            
            <div class="space-y-3">
                <div class="flex justify-between items-center">
                    <h2 class="text-sm font-black text-gray-800 flex items-center gap-1.5">
                        <i data-lucide="package" class="w-4 h-4 text-emerald-600"></i> Antrean Pesanan Masuk
                    </h2>
                    <span class="text-[10px] bg-amber-50 text-amber-700 border border-amber-100 px-2 py-0.5 rounded-full font-bold">Butuh Diproses</span>
                </div>
                
                <div id="toko-order-list" class="space-y-3">
                    </div>
            </div>

            <div class="space-y-3">
                <h2 class="text-sm font-black text-gray-800 flex items-center gap-1.5">
                    <i data-lucide="layers" class="w-4 h-4 text-emerald-600"></i> Pantau Stok Produk Gudang
                </h2>
                <div class="bg-white border border-gray-100 rounded-2xl shadow-sm divide-y divide-gray-50 overflow-hidden text-xs" id="toko-stock-list">
                    </div>
            </div>

            <div class="pt-4">
                <button onclick="handleTokoLogout()" class="w-full bg-rose-50 border border-rose-100 hover:bg-rose-100 text-rose-600 font-bold py-3 rounded-2xl text-xs transition btn-active flex items-center justify-center gap-2 shadow-sm">
                    <i data-lucide="power" class="w-4 h-4"></i> Keluar Dari Panel Dashboard
                </button>
            </div>

        </main>

        <footer class="text-center py-4 text-[10px] text-gray-400 font-bold">
            &copy; 2026 Segari Ecosystem. Hak Cipta Dilindungi.
        </footer>
    </div>

    <script>
        let session = null;
        let allOrders = [];
        let allProducts = [];

        window.addEventListener('DOMContentLoaded', () => {
            checkTokoAuth();
            loadDashboardData();
            lucide.createIcons();
        </script>
</body>
</html>
