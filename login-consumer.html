<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segari - Masuk Konsumen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-950 border border-slate-800 p-8 rounded-3xl shadow-2xl space-y-6">
        <!-- Logo & Header -->
        <div class="text-center space-y-2">
            <span class="text-3xl font-black text-green-500">se<span class="text-orange-500">gari</span></span>
            <h2 id="auth-title" class="text-xl font-bold text-white pt-2">Selamat Datang Kembali</h2>
            <p id="auth-subtitle" class="text-xs text-slate-400">Silakan masuk untuk melanjutkan belanja sayur segar</p>
        </div>

        <!-- Tab Toggle -->
        <div class="grid grid-cols-2 bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs font-bold">
            <button onclick="switchAuthMode('login')" id="btn-tab-login" class="py-2.5 rounded-lg bg-slate-800 text-white">Masuk</button>
            <button onclick="switchAuthMode('register')" id="btn-tab-register" class="py-2.5 rounded-lg text-slate-400 hover:text-slate-200">Daftar Akun</button>
        </div>

        <!-- Form Element -->
        <form id="consumer-form" onsubmit="handleAuth(event)" class="space-y-4 text-xs font-bold">
            <div class="space-y-1.5">
                <label class="text-slate-400">Username</label>
                <div class="relative flex items-center">
                    <i data-lucide="user" class="w-4 h-4 text-slate-500 absolute left-3"></i>
                    <input type="text" id="username" required placeholder="Masukkan username Anda" class="w-full pl-10 pr-4 py-3 bg-slate-900 border border-slate-800 rounded-xl focus:outline-none focus:ring-1 focus:ring-green-500 text-white">
                </div>
            </div>

            <div class="space-y-1.5">
                <label class="text-slate-400">Password</label>
                <div class="relative flex items-center">
                    <i data-lucide="lock" class="w-4 h-4 text-slate-500 absolute left-3"></i>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-3 bg-slate-900 border border-slate-800 rounded-xl focus:outline-none focus:ring-1 focus:ring-green-500 text-white">
                </div>
            </div>

            <button type="submit" id="btn-submit" class="w-full bg-green-500 hover:bg-green-600 text-slate-950 font-black py-3 rounded-xl transition shadow-lg shadow-green-500/10 text-sm mt-2">
                Masuk Sekarang
            </button>
        </form>

        <div class="text-center border-t border-slate-900 pt-4">
            <a href="login-toko.html" class="text-[11px] text-orange-400 hover:underline">Ingin berjualan? Masuk ke Dashboard Mitra Toko &rarr;</a>
        </div>
    </div>

    <script>
        let currentMode = 'login'; // login atau register
        
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            // Seeding data awal jika kosong
            if(!localStorage.getItem('segari_users')) {
                localStorage.setItem('segari_users', JSON.stringify([{username: 'admin', password: 'admin123', role: 'Admin'}]));
            }
        });

        function switchAuthMode(mode) {
            currentMode = mode;
            const title = document.getElementById('auth-title');
            const subtitle = document.getElementById('auth-subtitle');
            const btnSubmit = document.getElementById('btn-submit');
            
            document.getElementById('btn-tab-login').className = mode === 'login' ? 'py-2.5 rounded-lg bg-slate-800 text-white' : 'py-2.5 rounded-lg text-slate-400';
            document.getElementById('btn-tab-register').className = mode === 'register' ? 'py-2.5 rounded-lg bg-slate-800 text-white' : 'py-2.5 rounded-lg text-slate-400';

            if(mode === 'register') {
                title.innerText = "Buat Akun Baru";
                subtitle.innerText = "Daftar gratis untuk mulai berbelanja kebutuhan dapur harian";
                btnSubmit.innerText = "Daftar Akun Baru";
                btnSubmit.className = "w-full bg-orange-500 hover:bg-orange-600 text-slate-950 font-black py-3 rounded-xl transition shadow-lg text-sm mt-2";
            } else {
                title.innerText = "Selamat Datang Kembali";
                subtitle.innerText = "Silakan masuk untuk melanjutkan belanja sayur segar";
                btnSubmit.innerText = "Masuk Sekarang";
                btnSubmit.className = "w-full bg-green-500 hover:bg-green-600 text-slate-950 font-black py-3 rounded-xl transition shadow-lg text-sm mt-2";
            }
        }

        function handleAuth(e) {
            e.preventDefault();
            const userInp = document.getElementById('username').value.trim();
            const passInp = document.getElementById('password').value;
            let users = JSON.parse(localStorage.getItem('segari_users')) || [];

            if(currentMode === 'register') {
                // Logika pendaftaran akun konsumen baru
                if(users.some(u => u.username.toLowerCase() === userInp.toLowerCase())) {
                    alert("Username sudah terdaftar! Gunakan nama lain.");
                    return;
                }
                users.push({ username: userInp, password: passInp, role: 'Konsumen' });
                localStorage.setItem('segari_users', JSON.stringify(users));
                alert("Pendaftaran Berhasil! Silakan masuk menggunakan akun baru Anda.");
                switchAuthMode('login');
            } else {
                // Logika masuk akun konsumen
                const foundUser = users.find(u => u.username.toLowerCase() === userInp.toLowerCase() && u.password === passInp);
                if(!foundUser) {
                    alert("Kombinasi Username & Password salah!");
                    return;
                }
                if(foundUser.role !== 'Konsumen') {
                    alert(`Akun Anda terdaftar sebagai ${foundUser.role}. Silakan masuk di halaman yang sesuai.`);
                    return;
                }
                localStorage.setItem('segari_session', JSON.stringify({ username: foundUser.username, role: foundUser.role }));
                window.location.href = 'index.html'; // Melemparkan user kembali ke Mall Belanja
            }
        }
    </script>
</body>
</html>
