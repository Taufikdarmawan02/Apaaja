<div id="auth-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-end justify-center hidden opacity-0 transition-opacity duration-300">
            <div class="bg-white w-full max-w-[480px] rounded-t-3xl p-6 animate-slide-up space-y-4 shadow-2xl">
                <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                    <h3 class="text-base font-bold text-gray-800" id="auth-modal-title">Masuk ke Segari</h3>
                    <button onclick="closeAuthModal()" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <div class="space-y-3">
                    <div>
                        <label class="text-xs font-bold text-gray-600 block mb-1">Username</label>
                        <input type="text" id="auth-username" placeholder="Masukkan username" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500/20 text-gray-800">
                    </div>
                    <div id="auth-role-container" class="hidden">
                        <label class="text-xs font-bold text-gray-600 block mb-1">Pilih Peran</label>
                        <select id="auth-role" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500/20 text-gray-800">
                            <option value="Konsumen">Konsumen</option>
                            <option value="Toko">Mitra Toko</option>
                            <option value="Admin">Master Admin</option>
                        </select>
                    </div>
                    <button onclick="handleAuthSubmit()" class="w-full bg-green-600 text-white font-bold py-2.5 rounded-xl text-sm btn-active" id="auth-submit-btn">Masuk</button>
                    <p class="text-center text-xs text-gray-500" id="auth-toggle-text">Belum punya akun? <span onclick="toggleAuthMode()" class="text-green-600 font-bold cursor-pointer underline">Daftar Sekarang</span></p>
                </div>
            </div>
        </div>

        <div id="location-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-end justify-center hidden opacity-0 transition-opacity duration-300">
            <div class="bg-white w-full max-w-[480px] rounded-t-3xl p-6 animate-slide-up space-y-4">
                <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                    <h3 class="text-base font-bold text-gray-800">Ubah Lokasi Pengiriman</h3>
                    <button onclick="closeLocationModal()" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <div class="space-y-2">
                    <input type="text" id="address-input" placeholder="Masukkan alamat lengkap baru..." class="w-full px-3 py-2.5 bg-gray-50 border border-gray-100 text-sm rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500/20 text-gray-800">
                    <button onclick="saveLocation()" class="w-full bg-green-600 text-white font-bold py-2.5 rounded-xl text-xs btn-active">Simpan Alamat</button>
                </div>
            </div>
        </div>

        <div id="ai-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-end justify-center hidden opacity-0 transition-opacity duration-300">
            <div class="bg-white w-full max-w-[480px] rounded-t-3xl p-6 animate-slide-up space-y-4 max-h-[80vh] flex flex-col">
                <div class="flex justify-between items-center border-b border-gray-100 pb-3 shrink-0">
                    <div class="flex items-center gap-2">
                        <div class="p-1.5 bg-gradient-to-r from-teal-500 to-emerald-600 text-white rounded-lg"><i data-lucide="sparkles" class="w-4 h-4"></i></div>
                        <h3 class="text-sm font-bold text-gray-800">Asisten Koki AI Segari</h3>
                    </div>
                    <button onclick="closeAiModal()" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <div class="flex-grow overflow-y-auto space-y-3 py-2 text-xs no-scrollbar">
                    <div class="bg-gray-50 border border-gray-100 rounded-xl p-3 text-gray-700">
                        "Halo! Punya bahan makanan apa saja di kulkas? Ketik di bawah dan saya akan berikan rekomendasi resep sehat instan!"
                    </div>
                    <div id="ai-chat-history" class="space-y-3"></div>
                </div>
                <div class="flex gap-2 pt-2 border-t border-gray-100 shrink-0">
                    <input type="text" id="ai-input" placeholder="Misal: bayam, telur, wortel..." class="flex-grow px-3 py-2 bg-gray-50 text-xs rounded-xl border-none focus:outline-none focus:ring-2 focus:ring-green-500/20 text-gray-800">
                    <button onclick="askAiChef()" class="bg-green-600 text-white p-2 rounded-xl btn-active"><i data-lucide="send" class="w-4 h-4"></i></button>
                </div>
            </div>
        </div>

        <div id="toast-container"></div>

    </div>

    <script>
        // Data Dummy Seed Awal untuk Pengujian jika LocalStorage kosong
        const defaultProducts = [
            { id: 1, name: "Wortel Berastagi Segar", category: "sayur", price: 6000, oldPrice: 12000, size: "500 gr", stock: 45, img: "https://images.unsplash.com/photo-1598170845058-32b9d6a5da37?auto=format&fit=crop&q=80&w=300" },
            { id: 101, name: "Jeruk Santang Madu", category: "buah", price: 19500, oldPrice: 30000, size: "500 gr", stock: 20, img: "https://images.unsplash.com/photo-1557800636-894a64c1696f?auto=format&fit=crop&q=80&w=300" },
            { id: 2, name: "Bayam Hijau Hidroponik", category: "sayur", price: 4500, size: "250 gr", stock: 30, img: "https://images.unsplash.com/photo-1576045057995-568f588f82fb?auto=format&fit=crop&q=80&w=300" },
            { id: 3, name: "Apel Fuji Wangi Premium", category: "buah", price: 28000, size: "1 kg", stock: 15, img: "https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?auto=format&fit=crop&q=80&w=300" },
            { id: 4, name: "Daging Sapi Sirloin Lokal", category: "daging", price: 62000, size: "500 gr", stock: 10, img: "https://images.unsplash.com/photo-1603048588665-791ca8aea617?auto=format&fit=crop&q=80&w=300" },
            { id: 5, name: "Ayam Fillet Dada Segar", category: "daging", price: 34500, size: "500 gr", stock: 25, img: "https://images.unsplash.com/photo-1604503468506-a8da13d82791?auto=format&fit=crop&q=80&w=300" }
        ];

        let products = [];
        let cart = [];
        let activeUser = null;
        let selectedCategory = "semua";
        let isRegisterMode = false;

        // Inisialisasi Aplikasi
        window.addEventListener('DOMContentLoaded', () => {
            initDatabase();
            loadSession();
            renderProducts();
            updateCartCount();
            startFlashSaleTimer();
            lucide.createIcons();

            // Sinkronisasi data antar file tab via storage event
            window.addEventListener('storage', (e) => {
                if (['segari_products', 'segari_orders', 'segari_users', 'segari_session'].includes(e.key)) {
                    initDatabase();
                    loadSession();
                    renderProducts();
                    updateCartCount();
                }
            });
        });

        function initDatabase() {
            if (!localStorage.getItem('segari_products')) {
                localStorage.setItem('segari_products', JSON.stringify(defaultProducts));
            }
            if (!localStorage.getItem('segari_orders')) {
                localStorage.setItem('segari_orders', JSON.stringify([]));
            }
            if (!localStorage.getItem('segari_users')) {
                localStorage.setItem('segari_users', JSON.stringify([
                    { username: "admin", role: "Admin" },
                    { username: "toko", role: "Toko" },
                    { username: "budi", role: "Konsumen" }
                ]));
            }
            products = JSON.parse(localStorage.getItem('segari_products'));
        }

        function loadSession() {
            activeUser = JSON.parse(localStorage.getItem('segari_session')) || null;
            const profileText = document.getElementById('profile-text');
            if (activeUser) {
                profileText.innerText = activeUser.username;
                if (activeUser.role !== "Konsumen") {
                    profileText.innerText = `${activeUser.username} (${activeUser.role})`;
                }
            } else {
                profileText.innerText = "Akun";
            }
            
            const savedAddress = localStorage.getItem('segari_address');
            if (savedAddress) {
                document.getElementById('current-address-text').innerText = "Kirim ke: " + savedAddress;
            }
            renderTrackingView();
        }

        // Navigasi Tab SPA Aplikasi
        function switchTab(tabId) {
            const pages = ['home-page', 'cart-page', 'promo-page', 'tracking-page'];
            pages.forEach(p => {
                const el = document.getElementById(p);
                if (el) el.classList.add('hidden');
            });
            
            const targetPage = document.getElementById(`${tabId}-page`);
            if (targetPage) targetPage.classList.remove('hidden');

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-green-600');
                btn.classList.add('text-gray-400');
            });
            
            const activeBtn = event?.currentTarget;
            if (activeBtn) {
                activeBtn.classList.remove('text-gray-400');
                activeBtn.classList.add('text-green-600');
            }
            
            if (tabId === 'cart') renderCartItems();
            if (tabId === 'tracking') renderTrackingView();
            lucide.createIcons();
        }

        function handleCartTabClick() {
            switchTab('cart');
        }

        // Render Katalog Produk Utama
        function renderProducts(filterData = null) {
            const grid = document.getElementById('product-grid');
            if (!grid) return;
            grid.innerHTML = '';

            let list = filterData || products;
            
            if (selectedCategory !== 'semua' && !filterData) {
                list = list.filter(p => p.category === selectedCategory);
            }

            if (list.length === 0) {
                grid.innerHTML = `<div class="col-span-2 text-center py-8 text-xs text-gray-400">Produk tidak tersedia atau habis</div>`;
                return;
            }

            list.forEach(p => {
                const isOut = p.stock <= 0;
                const card = document.createElement('div');
                card.className = "bg-white border border-gray-100 rounded-2xl p-3 flex flex-col justify-between shadow-sm relative";
                card.innerHTML = `
                    <div>
                        <div class="relative mb-2 bg-gray-50 rounded-xl overflow-hidden aspect-square">
                            <img src="${p.img}" alt="${p.name}" class="w-full h-full object-cover ${isOut ? 'grayscale opacity-50':''}" onerror="this.src='https://placehold.co/300x300/green/white?text=Segari'">
                            ${p.oldPrice ? `<span class="absolute top-1.5 left-1.5 bg-red-500 text-white text-[9px] font-extrabold px-1.5 py-0.5 rounded-md shadow-sm">Promo</span>` : ''}
                            ${isOut ? `<div class="absolute inset-0 bg-black/40 flex items-center justify-center text-white text-[11px] font-black uppercase tracking-wider">Habis</div>` : ''}
                        </div>
                        <h4 class="text-xs font-bold text-gray-800 line-clamp-2 leading-tight">${p.name}</h4>
                        <p class="text-[10px] text-gray-400 mt-0.5 mb-2">${p.size} | Stok: <span class="font-bold text-gray-600">${p.stock}</span></p>
                    </div>
                    <div>
                        <div class="flex items-baseline gap-1">
                            <span class="text-xs font-extrabold text-green-600">Rp${p.price.toLocaleString('id-ID')}</span>
                            ${p.oldPrice ? `<span class="text-[9px] text-gray-400 line-through">Rp${p.oldPrice.toLocaleString('id-ID')}</span>` : ''}
                        </div>
                        <button onclick="handleAddToCart(${p.id})" ${isOut ? 'disabled class="w-full mt-2 bg-gray-200 text-gray-400 py-2 rounded-xl text-xs font-bold cursor-not-allowed"' : 'class="w-full mt-2 bg-green-500 hover:bg-green-600 text-white py-2 rounded-xl text-xs font-bold btn-active transition shadow-sm shadow-green-100 flex items-center justify-center gap-1"'}>
                            <i data-lucide="plus" class="w-3.5 h-3.5"></i> Beli
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        function filterCategory(cat) {
            selectedCategory = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('bg-green-50', 'border-green-100', 'text-green-700', 'font-bold');
                btn.classList.add('bg-gray-50', 'text-gray-600');
            });
            event.currentTarget.className = "category-btn flex flex-col items-center gap-1 bg-green-50 p-2 rounded-xl border border-green-100 transition btn-active font-bold text-green-700";
            
            document.getElementById('product-section-title').innerText = cat === 'semua' ? 'Semua Produk Segar' : `Kategori: ${cat.toUpperCase()}`;
            renderProducts();
        }

        function searchProducts() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(query));
            renderProducts(filtered);
        }

        // Keranjang Belanja & Logika Transaksi
        function handleAddToCart(id) {
            const prod = products.find(p => p.id === id);
            if (!prod || prod.stock <= 0) return;

            const cartIndex = cart.findIndex(item => item.id === id);
            if (cartIndex > -1) {
                if (cart[cartIndex].qty >= prod.stock) {
                    showToast("Batas maksimal stok toko tercapai!");
                    return;
                }
                cart[cartIndex].qty++;
            } else {
                cart.push({ ...prod, qty: 1 });
            }
            showToast(`${prod.name} ditambahkan!`);
            updateCartCount();
        }

        function updateCartCount() {
            const badge = document.getElementById('cart-badge');
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            if (totalQty > 0) {
                badge.innerText = totalQty;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function renderCartItems() {
            const activeState = document.getElementById('cart-active-state');
            const emptyState = document.getElementById('empty-cart-state');
            const listContainer = document.getElementById('cart-items-list');

            if (cart.length === 0) {
                activeState.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            activeState.classList.remove('hidden');
            listContainer.innerHTML = '';

            let subtotal = 0;
            cart.forEach((item, index) => {
                subtotal += item.price * item.qty;
                const itemDiv = document.createElement('div');
                itemDiv.className = "flex items-center gap-3 bg-white p-3 rounded-2xl border border-gray-100 shadow-sm";
                itemDiv.innerHTML = `
                    <img src="${item.img}" class="w-16 h-16 object-cover rounded-xl bg-gray-50">
                    <div class="flex-grow min-w-0">
                        <h4 class="text-xs font-bold text-gray-800 truncate">${item.name}</h4>
                        <p class="text-[10px] text-gray-400">${item.size}</p>
                        <div class="text-xs font-black text-green-600 mt-1">Rp${(item.price * item.qty).toLocaleString('id-ID')}</div>
                    </div>
                    <div class="flex items-center gap-2 border border-gray-100 rounded-xl p-1 bg-gray-50">
                        <button onclick="changeQty(${index}, -1)" class="w-6 h-6 rounded-lg bg-white flex items-center justify-center font-bold text-gray-600 text-xs shadow-sm"><i data-lucide="minus" class="w-3 h-3"></i></button>
                        <span class="text-xs font-bold text-gray-800 px-1">${item.qty}</span>
                        <button onclick="changeQty(${index}, 1)" class="w-6 h-6 rounded-lg bg-white flex items-center justify-center font-bold text-gray-600 text-xs shadow-sm"><i data-lucide="plus" class="w-3 h-3"></i></button>
                    </div>
                `;
                listContainer.appendChild(itemDiv);
            });

            document.getElementById('cart-total-items').innerText = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('price-subtotal').innerText = `Rp${subtotal.toLocaleString('id-ID')}`;
            document.getElementById('price-total').innerText = `Rp${subtotal.toLocaleString('id-ID')}`;
            lucide.createIcons();
        }

        function changeQty(index, amt) {
            const targetItem = cart[index];
            const masterProd = products.find(p => p.id === targetItem.id);
            
            targetItem.qty += amt;
            if (targetItem.qty > masterProd.stock) {
                showToast("Stok produk tidak mencukupi!");
                targetItem.qty = masterProd.stock;
            }
            if (targetItem.qty <= 0) {
                cart.splice(index, 1);
            }
            renderCartItems();
            updateCartCount();
        }

        function processCheckout() {
            if (!activeUser) {
                showToast("Silakan masuk akun terlebih dahulu!");
                openAuthModal();
                return;
            }
            
            const selectedSlot = document.querySelector('input[name="shipping-slot"]:checked').value;
            const currentOrders = JSON.parse(localStorage.getItem('segari_orders')) || [];
            
            // Validasi Potong Stok di database lokal master
            let masterProducts = JSON.parse(localStorage.getItem('segari_products'));
            let stockOk = true;

            cart.forEach(item => {
                let p = masterProducts.find(mp => mp.id === item.id);
                if (!p || p.stock < item.qty) stockOk = false;
            });

            if (!stockOk) {
                showToast("Gagal order! Seseorang telah membeli sisa stok barang produk Anda.");
                return;
            }

            // Eksekusi pemotongan stok berkurang
            cart.forEach(item => {
                let p = masterProducts.find(mp => mp.id === item.id);
                p.stock -= item.qty;
            });
            localStorage.setItem('segari_products', JSON.stringify(masterProducts));

            const newInvoice = `INV/SGR/2026-${Math.floor(1000 + Math.random() * 9000)}`;
            const orderPayload = {
                invoice: newInvoice,
                username: activeUser.username,
                items: cart,
                slot: selectedSlot,
                address: localStorage.getItem('segari_address') || "Rumah Saya Utama",
                total: cart.reduce((sum, i) => sum + (i.price * i.qty), 0),
                status: "Menyiapkan Pesanan",
                date: new Date().toLocaleDateString('id-ID')
            };

            currentOrders.push(orderPayload);
            localStorage.setItem('segari_orders', JSON.stringify(currentOrders));

            cart = [];
            updateCartCount();
            showToast("Pesanan Anda berhasil dibuat!");
            switchTab('tracking');
        }

        // Render Pelacakan Logistik Status Pesanan
        function renderTrackingView() {
            const noOrderState = document.getElementById('no-order-state');
            const activeOrderState = document.getElementById('active-order-state');
            if (!noOrderState || !activeOrderState) return;

            if (!activeUser) {
                noOrderState.classList.remove('hidden');
                activeOrderState.classList.add('hidden');
                return;
            }

            const globalOrders = JSON.parse(localStorage.getItem('segari_orders')) || [];
            const userOrder = globalOrders.filter(o => o.username === activeUser.username).pop(); // Ambil transaksi terupdate

            if (!userOrder) {
                noOrderState.classList.remove('hidden');
                activeOrderState.classList.add('hidden');
                return;
            }

            noOrderState.classList.add('hidden');
            activeOrderState.classList.remove('hidden');

            activeOrderState.innerHTML = `
                <div class="bg-white border border-gray-100 rounded-2xl p-4 mb-4 shadow-sm">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <p class="text-[10px] text-gray-400 uppercase tracking-wider font-bold">No. Invoice</p>
                            <h4 class="text-xs font-bold text-gray-800 font-mono">${userOrder.invoice}</h4>
                        </div>
                        <span class="bg-emerald-100 text-emerald-800 text-[10px] font-black px-2.5 py-1 rounded-full uppercase tracking-wide">
                            ${userOrder.status}
                        </span>
                    </div>
                    <div class="text-xs border-t border-dashed pt-2 text-gray-600 mb-2">
                         Total Belanja: <span class="font-bold text-green-600">Rp${userOrder.total.toLocaleString('id-ID')}</span>
                    </div>
                </div>
                
                <div class="bg-white border border-gray-100 rounded-2xl p-4 shadow-sm">
                    <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-4">Timeline Delivery</h3>
                    <div class="space-y-4">
                        ${buildStepLine("Menyiapkan Pesanan", "Pesanan Diterima Toko", "Pesanan sedang dikemas rapih di Hub Segari.", userOrder.status, 1)}
                        ${buildStepLine("Dalam Perjalanan", "Kurir Sedang Jalan", "Pesanan dibawa kurir motor roda dua menuju alamat.", userOrder.status, 2)}
                        ${buildStepLine("Selesai", "Paket Telah Tiba", "Barang diterima dalam kondisi segar bugar.", userOrder.status, 3)}
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function buildStepLine(stepKey, title, desc, currentStatus, orderNum) {
            const statusOrder = { "Menyiapkan Pesanan": 1, "Dalam Perjalanan": 2, "Selesai": 3 };
            const isDone = statusOrder[currentStatus] >= orderNum;
            const isCurrent = currentStatus === stepKey;

            return `
                <div class="flex gap-3">
                    <div class="flex flex-col items-center">
                        <div class="w-6 h-6 rounded-full ${isDone ? 'bg-green-500 text-white' : 'bg-gray-100 text-gray-400'} flex items-center justify-center text-xs font-bold z-10 ${isCurrent ? 'animate-pulse ring-4 ring-green-100':''}">
                            ${isDone ? '<i data-lucide="check" class="w-3.5 h-3.5"></i>' : orderNum}
                        </div>
                        ${orderNum < 3 ? `<div class="w-0.5 h-10 ${isDone ? 'bg-green-500':'bg-gray-200'} -mt-1"></div>` : ''}
                    </div>
                    <div>
                        <h4 class="text-xs font-bold ${isDone ? 'text-gray-800' : 'text-gray-400'}">${title}</h4>
                        <p class="text-[10px] ${isDone ? 'text-gray-500' : 'text-gray-400'} mt-0.5">${desc}</p>
                    </div>
                </div>
            `;
        }

        // Modals Event & Control Handlers
        function openLocationModal() { 
            const m = document.getElementById('location-modal'); m.classList.remove('hidden'); setTimeout(() => m.classList.add('opacity-100'), 10);
        }
        function closeLocationModal() { 
            const m = document.getElementById('location-modal'); m.classList.remove('opacity-100'); setTimeout(() => m.classList.add('hidden'), 300);
        }
        function saveLocation() {
            const input = document.getElementById('address-input').value;
            if(input.trim()) {
                localStorage.setItem('segari_address', input);
                document.getElementById('current-address-text').innerText = "Kirim ke: " + input;
                closeLocationModal();
                showToast("Alamat pengiriman berhasil diubah!");
            }
        }

        function openAiModal() { const m = document.getElementById('ai-modal'); m.classList.remove('hidden'); setTimeout(() => m.classList.add('opacity-100'), 10); }
        function closeAiModal() { const m = document.getElementById('ai-modal'); m.classList.remove('opacity-100'); setTimeout(() => m.classList.add('hidden'), 300); }
        function askAiChef() {
            const txt = document.getElementById('ai-input').value;
            if(!txt.trim()) return;
            const hist = document.getElementById('ai-chat-history');
            hist.innerHTML += `<div class="text-right"><span class="bg-green-100 text-green-900 px-2 py-1 rounded-lg inline-block max-w-[80%] mb-2">${txt}</span></div>`;
            document.getElementById('ai-input').value = '';
            
            setTimeout(() => {
                hist.innerHTML += `<div class="text-left"><span class="bg-gray-100 text-gray-800 px-2 py-1 rounded-lg inline-block max-w-[80%] mb-2">Rekomendasi AI: Buat <b>Tumis Sayur Segar Kombinasi Gurih</b>! Tumis bawang merah putih, masukkan sayur berurutan, tambahkan saus tiram secukupnya. Lezat & matang 5 menit!</span></div>`;
            }, 800);
        }

        function handleProfileClick() {
            if (activeUser) {
                if(confirm(`Halo ${activeUser.username}, ingin keluar akun?`)) {
                    localStorage.removeItem('segari_session');
                    loadSession();
                    showToast("Berhasil keluar.");
                }
            } else {
                openAuthModal();
            }
        }

        function openAuthModal() {
            isRegisterMode = false; updateAuthModalUI();
            const m = document.getElementById('auth-modal'); m.classList.remove('hidden'); setTimeout(() => m.classList.add('opacity-100'), 10);
        }
        function closeAuthModal() { const m = document.getElementById('auth-modal'); m.classList.remove('opacity-100'); setTimeout(() => m.classList.add('hidden'), 300); }
        
        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            updateAuthModalUI();
        }

        function updateAuthModalUI() {
            document.getElementById('auth-modal-title').innerText = isRegisterMode ? "Daftar Akun Baru Segari" : "Masuk ke Segari";
            document.getElementById('auth-submit-btn').innerText = isRegisterMode ? "Daftar Akun" : "Masuk";
            document.getElementById('auth-toggle-text').innerHTML = isRegisterMode ? "Sudah punya akun? <span onclick='toggleAuthMode()' class='text-green-600 font-bold cursor-pointer underline'>Masuk</span>" : "Belum punya akun? <span onclick='toggleAuthMode()' class='text-green-600 font-bold cursor-pointer underline'>Daftar Sekarang</span>";
            document.getElementById('auth-role-container').className = isRegisterMode ? "block" : "hidden";
        }

        function handleAuthSubmit() {
            const userStr = document.getElementById('auth-username').value.trim();
            if(!userStr) return;

            let users = JSON.parse(localStorage.getItem('segari_users')) || [];

            if (isRegisterMode) {
                const roleStr = document.getElementById('auth-role').value;
                if(users.some(u => u.username === userStr)) { showToast("Username sudah terpakai!"); return; }
                const newU = { username: userStr, role: roleStr };
                users.push(newU);
                localStorage.setItem('segari_users', JSON.stringify(users));
                localStorage.setItem('segari_session', JSON.stringify(newU));
                showToast("Pendaftaran sukses!");
            } else {
                const match = users.find(u => u.username === userStr);
                if (!match) { showToast("User tidak ditemukan, daftar dulu!"); return; }
                localStorage.setItem('segari_session', JSON.stringify(match));
                showToast(`Selamat datang kembali, ${match.username}!`);
                
                // Redirect otomatis ke file toko atau admin jika rolenya sesuai
                if(match.role === "Toko") window.location.href = "toko.html";
                if(match.role === "Admin") window.location.href = "admin.html";
            }
            loadSession(); closeAuthModal(); renderProducts();
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = "toast-msg";
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function startFlashSaleTimer() {
            let h = 2, m = 14, s = 45;
            setInterval(() => {
                s--; if(s < 0) { s = 59; m--; if(m < 0) { m = 59; h--; if(h < 0) h = 2; } }
                document.getElementById('timer-hours').innerText = String(h).padStart(2, '0');
                document.getElementById('timer-mins').innerText = String(m).padStart(2, '0');
                document.getElementById('timer-secs').innerText = String(s).padStart(2, '0');
            }, 1000);
        }
    </script>
</body>
</html>
