<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segari HQ - Admin Terminal System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div id="login-view" class="w-full max-w-sm bg-slate-950 border border-red-500/20 p-8 rounded-3xl shadow-2xl relative overflow-hidden hidden">
        <div class="absolute top-0 inset-x-0 h-1 bg-gradient-to-r from-red-500 via-orange-500 to-yellow-500"></div>
        <div class="space-y-6">
            <div class="text-center space-y-1">
                <div class="flex items-center justify-center gap-2">
                    <span class="text-2xl font-black text-green-500">se<span class="text-orange-500">gari</span></span>
                    <span class="bg-red-500/20 text-red-400 text-[10px] font-bold px-1.5 py-0.5 rounded border border-red-500/30">HQ</span>
                </div>
                <h2 class="text-md font-bold text-slate-300 tracking-wider uppercase pt-3">Core Terminal Gateway</h2>
                <p class="text-[11px] text-slate-500">Restricted area for authorized platform master only</p>
            </div>

            <form onsubmit="handleAdminLogin(event)" class="space-y-4 text-xs font-bold">
                <div class="space-y-1.5">
                    <label class="text-slate-400 uppercase tracking-wide text-[10px]">Security Clearance ID</label>
                    <div class="relative flex items-center">
                        <i data-lucide="shield-check" class="w-4 h-4 text-red-400 absolute left-3"></i>
                        <input type="text" id="adm-uid" required placeholder="Username root admin" class="w-full pl-10 pr-4 py-3 bg-slate-900 border border-slate-800 rounded-xl focus:outline-none focus:ring-1 focus:ring-red-500 text-white font-mono">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-slate-400 uppercase tracking-wide text-[10px]">Passkey Token</label>
                    <div class="relative flex items-center">
                        <i data-lucide="key-round" class="w-4 h-4 text-red-400 absolute left-3"></i>
                        <input type="password" id="adm-pass" required placeholder="••••••••" class="w-full pl-10 pr-4 py-3 bg-slate-900 border border-slate-800 rounded-xl focus:outline-none focus:ring-1 focus:ring-red-500 text-white">
                    </div>
                </div>

                <button type="submit" class="w-full bg-red-500 hover:bg-red-600 text-white font-black py-3 rounded-xl transition shadow-lg shadow-red-950/50 text-xs uppercase tracking-wider mt-2">
                    Otentikasi Akses Root &rarr;
                </button>
            </form>

            <div class="text-center pt-2 border-t border-slate-900">
                <button onclick="switchView('register')" class="text-[11px] text-orange-400 hover:underline">
                    Belum terdaftar? Ajukan Pendaftaran Admin Baru
                </button>
            </div>
        </div>
    </div>

    <div id="register-view" class="w-full max-w-sm bg-slate-950 border border-orange-500/20 p-8 rounded-3xl shadow-2xl relative overflow-hidden hidden">
        <div class="absolute top-0 inset-x-0 h-1 bg-gradient-to-r from-orange-500 to-yellow-500"></div>
        <div class="space-y-6">
            <div class="text-center space-y-1">
                <div class="flex items-center justify-center gap-2">
                    <span class="text-2xl font-black text-green-500">se<span class="text-orange-500">gari</span></span>
                    <span class="bg-orange-500/20 text-orange-400 text-[10px] font-bold px-1.5 py-0.5 rounded border border-orange-500/30">REG</span>
                </div>
                <h2 class="text-md font-bold text-slate-300 tracking-wider uppercase pt-3">Admin Registration Node</h2>
                <p class="text-[11px] text-slate-500">Buat kredensial clearance baru untuk otoritas Admin</p>
            </div>

            <form onsubmit="handleAdminRegister(event)" class="space-y-4 text-xs font-bold">
                <div class="space-y-1.5">
                    <label class="text-slate-400 uppercase tracking-wide text-[10px]">New Security ID (Username)</label>
                    <div class="relative flex items-center">
                        <i data-lucide="user-plus" class="w-4 h-4 text-orange-400 absolute left-3"></i>
                        <input type="text" id="reg-uid" required placeholder="Contoh: admin_baru" class="w-full pl-10 pr-4 py-3 bg-slate-900 border border-slate-800 rounded-xl focus:outline-none focus:ring-1 focus:ring-orange-500 text-white font-mono">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-slate-400 uppercase tracking-wide text-[10px]">Passkey Token (Password)</label>
                    <div class="relative flex items-center">
                        <i data-lucide="lock" class="w-4 h-4 text-orange-400 absolute left-3"></i>
                        <input type="password" id="reg-pass" required placeholder="Minimal 6 karakter" class="w-full pl-10 pr-4 py-3 bg-slate-900 border border-slate-800 rounded-xl focus:outline-none focus:ring-1 focus:ring-orange-500 text-white">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-slate-400 uppercase tracking-wide text-[10px]">Konfirmasi Passkey</label>
                    <div class="relative flex items-center">
                        <i data-lucide="check-square" class="w-4 h-4 text-orange-400 absolute left-3"></i>
                        <input type="password" id="reg-confirm" required placeholder="Ulangi passkey Anda" class="w-full pl-10 pr-4 py-3 bg-slate-900 border border-slate-800 rounded-xl focus:outline-none focus:ring-1 focus:ring-orange-500 text-white">
                    </div>
                </div>

                <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-black py-3 rounded-xl transition shadow-lg shadow-orange-950/50 text-xs uppercase tracking-wider mt-2">
                    Daftarkan Akun Otoritas &rarr;
                </button>
            </form>

            <div class="text-center pt-2 border-t border-slate-900">
                <button onclick="switchView('login')" class="text-[11px] text-slate-400 hover:underline">
                    Sudah punya akun? Kembali ke Gerbang Login
                </button>
            </div>
        </div>
    </div>

    <script>
        const DB_KEY = 'segari_users_v3';
        const SESSION_KEY = 'segari_session_v3';

        window.addEventListener('DOMContentLoaded', () => { 
            if(!localStorage.getItem(DB_KEY)) {
                const defaultAdmins = [
                    { username: 'admin', password: 'admin123', role: 'Admin' },
                    { username: 'superadmin', password: 'hq_master2026', role: 'Admin' }
                ];
                localStorage.setItem(DB_KEY, JSON.stringify(defaultAdmins));
            }
            checkSession();
        });

        function switchView(viewName) {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('register-view').classList.add('hidden');
            if(viewName === 'login') document.getElementById('login-view').classList.remove('hidden');
            if(viewName === 'register') document.getElementById('register-view').classList.remove('hidden');
            lucide.createIcons();
        }

        // Jika ada sesi admin aktif, langsung lempar ke index.html
        function checkSession() {
            const session = JSON.parse(localStorage.getItem(SESSION_KEY));
            if (session && session.role === 'Admin') {
                window.location.href = 'admin.html';
            } else {
                switchView('login');
            }
        }

        function handleAdminRegister(e) {
            e.preventDefault();
            const uid = document.getElementById('reg-uid').value.trim();
            const pass = document.getElementById('reg-pass').value;
            const confirmPass = document.getElementById('reg-confirm').value;

            if (pass.length < 6) {
                alert("Gagal Enkripsi! Passkey token minimal harus 6 karakter.");
                return;
            }
            if (pass !== confirmPass) {
                alert("Gagal Verifikasi! Konfirmasi passkey tidak cocok.");
                return;
            }

            const users = JSON.parse(localStorage.getItem(DB_KEY)) || [];
            const isExist = users.some(u => u.username.toLowerCase() === uid.toLowerCase());
            if (isExist) {
                alert("Pelanggaran Kredensial! ID tersebut sudah terdaftar.");
                return;
            }

            users.push({ username: uid, password: pass, role: 'Admin' });
            localStorage.setItem(DB_KEY, JSON.stringify(users));
            alert("Sukses didaftarkan!");
            
            document.getElementById('reg-uid').value = '';
            document.getElementById('reg-pass').value = '';
            document.getElementById('reg-confirm').value = '';
            switchView('login');
        }

        function handleAdminLogin(e) {
            e.preventDefault();
            const uid = document.getElementById('adm-uid').value.trim();
            const pass = document.getElementById('adm-pass').value;
            
            const users = JSON.parse(localStorage.getItem(DB_KEY)) || [];
            const targetAdmin = users.find(u => u.username.toLowerCase() === uid.toLowerCase() && u.password === pass);

            if (!targetAdmin) {
                alert("Akses Ditolak! ID atau passkey salah.");
                return;
            }

            // Set Sesi login lokal
            localStorage.setItem(SESSION_KEY, JSON.stringify({ username: targetAdmin.username, role: targetAdmin.role }));
            
            // REDIRECT KE DASHBOARD UTAMA
            window.location.href = 'admin.html';
        }
    </script>
</body>
</html>
